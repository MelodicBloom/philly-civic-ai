name: Agrarian Futures Web Validation

on:
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.js'
      - 'tailwind.config.js'
      - 'postcss.config.cjs'
      - 'index.html'
      - '.github/workflows/web-validate.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.js'
      - 'tailwind.config.js'
      - 'postcss.config.cjs'
      - 'index.html'

permissions:
  contents: read

concurrency:
  group: agrarian-web-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install dependencies
        shell: bash
        run: |
          if [[ -f package-lock.json ]]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Lint and build
        run: npm run validate

      - name: Install Chromium for visual audit
        run: npx playwright install --with-deps chromium

      - name: Audit story and existing views
        shell: bash
        run: |
          npm run preview -- --host 127.0.0.1 > preview.log 2>&1 &
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then break; fi
            sleep 1
          done
          npm run visual:audit

      - name: Save audit screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agrarian-visual-audit
          path: |
            visual-artifacts/
            preview.log
          if-no-files-found: ignore
